<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - macOS rounded square with gradient -->
  <rect x="20" y="20" width="280" height="280" rx="62" fill="url(#bgGradient)" />
  
  <!-- Subtle inner shadow for depth -->
  <rect x="20" y="20" width="280" height="280" rx="62" fill="url(#innerShadow)" />
  
  <!-- Photo stack effect - back photo -->
  <g opacity="0.4">
    <rect x="80" y="100" width="160" height="120" rx="8" fill="white" transform="rotate(-4 160 160)" />
  </g>
  
  <!-- Photo stack effect - middle photo -->
  <g opacity="0.6">
    <rect x="85" y="95" width="160" height="120" rx="8" fill="white" transform="rotate(2 160 160)" />
  </g>
  
  <!-- Main photo frame -->
  <rect x="90" y="90" width="160" height="120" rx="8" fill="white" />
  
  <!-- Photo content - gradient sky -->
  <rect x="95" y="95" width="150" height="110" rx="6" fill="url(#photoGradient)" />
  
  <!-- Mountain silhouette in photo -->
  <path d="M95 180 L130 140 L165 165 L200 130 L245 175 L245 205 L95 205 Z" fill="rgba(0, 0, 0, 0.2)" />
  
  <!-- Sun/moon circle in photo -->
  <circle cx="210" cy="120" r="18" fill="rgba(255, 255, 255, 0.9)" />
  
  <!-- Selection checkmark - vibrant accent -->
  <g transform="translate(200, 175)">
    <!-- Circle background -->
    <circle cx="20" cy="20" r="28" fill="url(#checkGradient)" filter="url(#checkShadow)" />
    
    <!-- Checkmark -->
    <path d="M12 20 L18 26 L30 14" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  
  <!-- Reject X mark - subtle -->
  <g transform="translate(60, 175)" opacity="0.5">
    <!-- Circle background -->
    <circle cx="20" cy="20" r="22" fill="#ff3b30" />
    
    <!-- X mark -->
    <path d="M14 14 L26 26 M26 14 L14 26" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Gradients and filters -->
  <defs>
    <!-- Main background gradient - vibrant blue to purple -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7CFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <!-- Inner shadow for depth -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.2)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.1)" />
    </linearGradient>
    
    <!-- Photo content gradient -->
    <linearGradient id="photoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="100%" stop-color="#FFA07A" />
    </linearGradient>
    
    <!-- Checkmark gradient - green to teal -->
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#30D5C8" />
    </linearGradient>
    
    <!-- Shadow for checkmark -->
    <filter id="checkShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
</svg>
