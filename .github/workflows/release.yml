# Publishes compiled artifacts to a GitHub Release when a v* tag is pushed.
#
# pubspec.yaml has a path dependency on the sibling repo ../ceyx/plugin
# (github.com/jhangyu/ceyx), so — exactly like ci.yml — every job checks out
# BOTH repos side by side under the workspace (Halcyon/ + ceyx/) and runs every
# step from Halcyon/. A bare root-level checkout can never pub get.
#
# The `jhangyu/ceyx` checkout below is pinned to a fixed `ref` (current ceyx
# main HEAD, verified green) so unrelated ceyx pushes can't redden Halcyon CI.
# To bump: update the ref in both ci.yml and release.yml.
#
# scripts/build_apps.py is the SINGLE build entry point; jobs invoke it (via
# scripts/ci.py, see scripts/ci/) per target and never call `flutter build`
# directly. Artifact output paths are taken verbatim from
# build_apps.py:flutter_artifact() (scripts/build_apps.py:1376):
#   macos   -> build/macos/Build/Products/Release/Halcyon.app
#   windows -> build/windows/x64/runner/Release/
#   linux   -> build/linux/<arch>/release/bundle/
#
# Every platform job here is a REAL gate. `continue-on-error: true` was briefly
# present on the Windows and Linux jobs and was removed on 2026-08-28 by explicit
# user instruction: a job that cannot fail cannot tell you anything, and it had
# concealed the fact that the Windows release build had never once been attempted.
# If a platform breaks, this workflow goes red and we fix it — don't reinstate it.
# `fail-fast: false` on the matrix below is NOT the same thing as
# `continue-on-error`: it only lets sibling matrix legs finish instead of being
# cancelled — a leg still fails when it fails. Don't "clean up" one into the other.
name: Release

# Two entry points, both real:
#   * `push: tags: v*`  — a human pushing a tag, unchanged behaviour.
#   * `workflow_dispatch` — the auto-release gate in ci.yml (and manual use).
#     `publish` decides which kind of dispatch it is: false (the default, so a
#     hand-triggered run stays harmless) builds/packages/preflights and stops,
#     preserving the old dry-run capability; true additionally publishes. The
#     gate always passes publish=true. A tag pushed by GITHUB_TOKEN would NOT
#     trigger the push path above — that is exactly why the gate dispatches.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v1.0.4 (dry-run default publishes nothing)'
        required: false
        default: 'v0.0.0-dryrun'
      publish:
        description: 'Publish a GitHub Release for `version` and mark it Latest'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  HALCYON_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

defaults:
  run:
    working-directory: Halcyon

jobs:
  release:
    name: Release (${{ matrix.target }})
    strategy:
      fail-fast: false        # lets sibling matrix legs finish; a leg still fails when it fails
      matrix:
        include:
          - {os: macos-14,       target: macos,   archive: 'Halcyon-macos-arm64-'}
          - {os: windows-latest, target: windows, archive: 'Halcyon-windows-x64-'}
          - {os: ubuntu-latest,  target: linux,   archive: 'Halcyon-linux-x64-'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          ref: 633aaa5b2e76661a42b1c557f22ff8537129be6c
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          # R-8 cache added in F6 after R-7 assertions are green (Spec §6)

      - name: ci.py provision
        run: python3 scripts/ci.py provision --target ${{ matrix.target }}

      - name: ci.py build
        run: python3 scripts/ci.py build --target ${{ matrix.target }}

      - name: ci.py assert-capabilities
        run: python3 scripts/ci.py assert-capabilities --target ${{ matrix.target }}

      - name: ci.py package
        run: python3 scripts/ci.py package --target ${{ matrix.target }} --version ${{ env.HALCYON_VERSION }}

      - name: ci.py release-preflight
        run: python3 scripts/ci.py release-preflight --version ${{ env.HALCYON_VERSION }} --target ${{ matrix.target }}

      # if: always() and placed before publish so a failed build still ships its
      # logs. Name carries the matrix target — upload-artifact@v4 rejects
      # duplicate artifact names across legs of the same run.
      - name: Upload ci-logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs-release-${{ matrix.target }}
          path: Halcyon/build/ci-logs/**
          if-no-files-found: warn

      # `make_latest: true` is NOT redundant (2026-09-01, this machine): GitHub
      # does not automatically move the Latest marker, and two releases had to be
      # hand-corrected afterwards. State it explicitly and it stays stated.
      #
      # tag_name/target_commitish are required for the dispatch path: on a
      # workflow_dispatch, github.ref is refs/heads/main, so the tag cannot be
      # inferred from the ref. The action creates refs/tags/<version> at this
      # run's commit — meaning the tag only ever comes into existence once the
      # build for it has succeeded, and a failed release leaves no dangling tag.
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        with:
          tag_name: ${{ env.HALCYON_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: Halcyon/${{ matrix.archive }}${{ env.HALCYON_VERSION }}.*
          fail_on_unmatched_files: true
