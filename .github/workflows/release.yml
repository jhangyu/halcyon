# Publishes compiled artifacts to a GitHub Release when a v* tag is pushed.
#
# pubspec.yaml has a path dependency on the sibling repo ../ceyx/plugin
# (github.com/jhangyu/ceyx), so — exactly like ci.yml — every job checks out
# BOTH repos side by side under the workspace (Halcyon/ + ceyx/) and runs every
# step from Halcyon/. A bare root-level checkout can never pub get.
#
# scripts/build_apps.py is the SINGLE build entry point; jobs invoke it per
# target and never call `flutter build` directly. Artifact output paths are
# taken verbatim from build_apps.py:flutter_artifact() (scripts/build_apps.py:1376):
#   macos   -> build/macos/Build/Products/Release/Halcyon.app
#   windows -> build/windows/x64/runner/Release/
#   linux   -> build/linux/<arch>/release/bundle/
#
# Every platform job here is a REAL gate. `continue-on-error: true` was briefly
# present on the Windows and Linux jobs and was removed on 2026-08-28 by explicit
# user instruction: a job that cannot fail cannot tell you anything, and it had
# concealed the fact that the Windows release build had never once been attempted.
# If a platform breaks, this workflow goes red and we fix it — don't reinstate it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: Halcyon

jobs:
  macos:
    name: Release macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: flutter pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: Halcyon/macos

      - name: Build via single entry point (scripts/build_apps.py)
        run: python3 scripts/build_apps.py macos

      - name: Package app bundle
        run: |
          ditto -c -k --keepParent \
            "build/macos/Build/Products/Release/Halcyon.app" \
            "Halcyon-macos-arm64-${GITHUB_REF_NAME}.zip"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Halcyon/Halcyon-macos-arm64-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true

  windows:
    name: Release Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: flutter pub get
        run: flutter pub get

      - name: Build via single entry point (scripts/build_apps.py)
        run: python3 scripts/build_apps.py windows

      - name: Package runner folder
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Halcyon-windows-x64-${env:GITHUB_REF_NAME}.zip"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Halcyon/Halcyon-windows-x64-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true

  linux:
    name: Release Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: flutter pub get
        run: flutter pub get

      - name: Build via single entry point (scripts/build_apps.py)
        run: python3 scripts/build_apps.py linux

      - name: Package bundle
        run: |
          bundle_dir="$(find build/linux -type d -path '*/release/bundle' | head -n1)"
          test -n "$bundle_dir" || { echo "no linux release bundle found"; exit 1; }
          tar -czf "Halcyon-linux-x64-${GITHUB_REF_NAME}.tar.gz" -C "$(dirname "$bundle_dir")" bundle

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Halcyon/Halcyon-linux-x64-${{ github.ref_name }}.tar.gz
          fail_on_unmatched_files: true
