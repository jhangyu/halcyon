# pubspec.yaml has a path dependency on the sibling repo ../ceyx/plugin
# (github.com/jhangyu/ceyx), so CI checks out BOTH repos side by side under the
# workspace (Halcyon/ + ceyx/) and runs every step from Halcyon/. A bare
# root-level checkout can never pub get — don't "simplify" this back.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: Halcyon

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test -j 1

  analyze-test-windows:
    name: Analyze & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test -j 1

  analyze-test-linux:
    name: Analyze & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test -j 1

  build:
    name: Build macOS (release)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: flutter pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: Halcyon/macos

      - name: Build via single entry point (scripts/build_apps.py)
        run: python3 scripts/build_apps.py
