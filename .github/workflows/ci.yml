# pubspec.yaml has a path dependency on the sibling repo ../ceyx/plugin
# (github.com/jhangyu/ceyx), so CI checks out BOTH repos side by side under the
# workspace (Halcyon/ + ceyx/) and runs every step from Halcyon/. A bare
# root-level checkout can never pub get — don't "simplify" this back.
#
# Build/test/verify logic is delegated to scripts/ci.py (see scripts/ci/); every
# `run:` step below is exactly one `python3 scripts/ci.py ...` line, plus the
# environment-setup `uses:` steps. `fail-fast: false` is NOT `continue-on-error`:
# a job still fails when it fails; it only lets sibling OS jobs in the matrix
# finish instead of being cancelled — don't "clean up" one into the other.
#
# Every `jhangyu/ceyx` checkout below is pinned to a fixed `ref` (current ceyx
# main HEAD, verified green) so unrelated ceyx pushes can't redden Halcyon CI.
# To bump: update the ref in both ci.yml and release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: Halcyon

jobs:
  verify:
    name: Analyze (${{ matrix.os }})
    strategy:
      fail-fast: false        # lets sibling OS jobs finish; a job still fails when it fails
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Belt-and-suspenders alongside scripts/ci/run.py's explicit
      # encoding="utf-8" on subprocess.run: without this, Python on Windows
      # defaults to the console codepage (cp1252) for text I/O, which can
      # decode flutter analyze's UTF-8 output incorrectly.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          ref: 6b27ed0e5b460ee3e9636ff4b8225f6fd1fd290b
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          # R-8 cache added in F6 after R-7 assertions are green (Spec §6)

      - name: ci.py selftest (argv rendering + policy lints)
        run: python3 scripts/ci.py selftest

      - name: ci.py verify (pub get -> analyze; CI is compile-only, no test leg)
        run: python3 scripts/ci.py verify

      # if: always() — the logs are only interesting when the step above failed.
      # Names must be unique across jobs/matrix legs or upload-artifact@v4 rejects
      # the collision, hence the matrix value in the name.
      - name: Upload ci-logs (verify ${{ matrix.os }})
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ci-logs-verify-${{ matrix.os }}
          path: Halcyon/build/ci-logs/**
          if-no-files-found: warn

  # Two macOS legs, one per architecture. BOTH run on macos-14 (Apple silicon):
  # the x64 leg is a CROSS-COMPILE (`--macos-arch x86_64`, rendered by
  # scripts/ci/targets.py), not an Intel runner. That is deliberate — it matches
  # how the capability was first proved locally and avoids depending on the
  # retiring macos-13 Intel image — and it has a stated cost: the functional FFI
  # probe cannot load an x86_64 dylib from an arm64 process, so the x64 leg's
  # assertion list omits it in data and gates on Mach-O header + nm symbol
  # checks instead. A green x64 leg therefore does NOT claim runtime loadability
  # on real Intel hardware. See the "assertions" comment in targets.py.
  build:
    name: Build ${{ matrix.target }} (release)
    strategy:
      fail-fast: false        # lets the sibling arch leg finish; a leg still fails when it fails
      matrix:
        target: [macos, macos-x64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - uses: actions/checkout@v4
        with:
          repository: jhangyu/ceyx
          ref: 6b27ed0e5b460ee3e9636ff4b8225f6fd1fd290b
          path: ceyx

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          # R-8 cache added in F6 after R-7 assertions are green (Spec §6)

      - name: ci.py provision
        run: python3 scripts/ci.py provision --target ${{ matrix.target }}

      - name: ci.py build
        run: python3 scripts/ci.py build --target ${{ matrix.target }}

      - name: ci.py assert-capabilities
        run: python3 scripts/ci.py assert-capabilities --target ${{ matrix.target }}

      # Names must be unique across matrix legs or upload-artifact@v4 rejects the
      # collision, hence the matrix value in the name.
      - name: Upload ci-logs (build ${{ matrix.target }})
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ci-logs-build-${{ matrix.target }}
          path: Halcyon/build/ci-logs/**
          if-no-files-found: warn

  # Auto-release gate (2026-09-05 contract, user ruling option 1): the LAST job,
  # gated on every other job being green and on this being a real push to main
  # (never a pull_request, where secrets/permissions differ and no release is
  # wanted). It reads pubspec.yaml's version and, if v<X.Y.Z> has no tag yet,
  # dispatches release.yml for it; if the tag exists it logs AUTO-RELEASE-SKIP
  # and exits 0. `needs` makes "green" mechanical: a red verify leg on ANY OS
  # skips this job entirely, so a broken build can never publish a release.
  #
  # No ceyx checkout here on purpose — this job builds nothing (scripts/ci.py
  # exempts auto-release from the sibling-checkout requirement).
  #
  # `actions: write` is what lets GITHUB_TOKEN start release.yml. A tag PUSHED
  # with GITHUB_TOKEN would NOT trigger release.yml's `on: push: tags` (GitHub
  # suppresses workflow events from that token to prevent recursion); a
  # workflow_dispatch through the API is the documented path that does work.
  auto-release:
    name: Auto-release gate
    needs: [verify, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: Halcyon

      - name: ci.py auto-release (publish pubspec version if its tag is absent)
        run: python3 scripts/ci.py auto-release --repo ${{ github.repository }} --ref main
